[device]
# The phone calls itself OP60F0L1 in its own build; ro.board.platform says the
# platform is sun and oplusboot.prjname says 24816. The market name is OnePlus
# Turbo 6 (PLU110). It is not the Ace 6 (PLQ110, ossi, project 0x6113) and not
# the Ace 6T (PLR110): an image made for those does not start here.
codename = "op60f0l1"
# What the phone answers to `ro.product.device`. Its own build says OP60F0L1 in
# capitals, and its full update packages name the phone by that in their
# metadata; update_engine compares the two before it writes anything. The
# stock recovery's property files never set this, so the recovery came up
# answering to the codename below instead, and the phone's own package was
# refused as one made for another phone. It is written into the recovery's
# prop.default from here, where init sets it once and only once.
#
# The codename above stays as it is: backups are named with it and refuse to be
# restored on another phone, and the recovery's own releases are named with it.
product_device = "OP60F0L1"
brand = "OnePlus"
model = "OnePlus Turbo 6"
ab = true
# File transfer over the port, and adb, one at a time. The recovery's own
# receive page serves the file transfer whatever this says: this is the state
# the switch in the settings page starts in, and on this phone that is off, so
# that a computer has adb as soon as the pages are up.
#
# The two in one configuration are known to reset this port on the Ace 6, the
# same platform and the same OPLUS stock init, and that was never ruled out
# here: the computer sees the device leave and come back, adb drops with it,
# and no command outlives a second. Since the port carries one or the other
# now, a port that turns out to take both costs nothing but a toggle.
mtp = false
# qseecomd runs in the tee domain on OPLUS, and this recovery's own policy keeps
# the recovery domain away from the tee and dma-heap nodes it opens.
selinux_permissive = true
# Snapdragon 8s Gen 4 = SM8735, Adreno 825, on the same sun platform the
# SM8750 of the Ace 6 is on; the silicon is not the same.
soc = { hans = "骁龙®8s Gen 4 移动平台", hant = "驍龍®8s Gen 4 行動平台", en = "Snapdragon® 8s Gen 4 Mobile Platform" }
# The About page reads the version from the installed system's build.prop:
# /my_product/build.prop carries ro.build.version.oplusrom = V16.1.0 here, and
# /etc/build.prop does not exist at all on this firmware.
os_version_prop = "ro.build.version.oplusrom"

[display]
# The panel is AA610_P_3_A0034_dsc_vid (BOE). The connector reports its modes
# as 1272x2772 at 30, 60, 90, 120, 144 and 165 Hz, the fastest of which the
# recovery picks by refresh rate, so the panel being a video-mode panel where
# the Ace 6's is a command-mode one changes nothing here. The stock system runs
# the panel at 1272x2772 and its density is 560.
width = 1272
height = 2772
density = 560
diagonal = 6.78
# Reported by the display service as 143 on every corner.
corner_radius = 143
# Brightness: the panel's node in the device tree is not under
# /proc/device-tree/soc by its own name as on the Xiaomi kernels, but under
# the display processor. This port's own lookup looks in both places. The
# properties it wants are there, on the same scale as on the Ace 6:
#
#   oplus,dsi-brightness-normal-max-level   0x0dbb = 3515
#   qcom,mdss-brightness-max-level          0x0ffe = 4094
#   oplus,dsi-bl-normal-max-level           3515
#   qcom,mdss-dsi-bl-max-level              4094

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# Touch is the same family as on the Ace 6: Synaptics S3910 over SPI under
# OPLUS's hbp layer, with oplus_hbp_core and oplus_bsp_tp_hbp_syna_s3910 both
# marked [permanent], so the driver is in the kernel already and only the
# interrupt has to be switched on, with ioctl 0xC50A on /dev/hbp0, which the
# port does in Inputs::open(). The vibration motor is qcom-hv-haptics; the NFC
# chip is NXP's and the node it makes on this phone is /dev/tms_nfc.
#
# The touch driver keeps its own log at INFO, which on an OPLUS hbp stack is a
# line of hex and a line of coordinates for every report: thousands of lines a
# second while a finger moves, a full log ring and a phone that stops
# answering. This port turns the level down to FATAL as it turns the
# interrupt on (ioctl 0xC514 on /dev/hbp0), so nothing here has to say that.
#
# The USB port's own modules — the codec that holds its Type-C switch, the
# switch chip beside it, the redriver and the repeater in front of them, which
# were loaded here on the strength of the Ace 6's first port — are left to the
# phone, as the OnePlus 13 and Ace 6 ports leave them. wcd_usbss_i2c is the
# one that matters: with a cable in it runs a surge check on the port every
# fifteen seconds over the codec's I2C, and on the Ace 6 that check is what
# the kernel stopped answering in, at forty-eight seconds, dmesg included. The
# gadget and the port's role are the stock init's work, not these modules', so
# adb is there without them. If the port turns out dead with a cable in, put
# these back and keep the cable out while the recovery is used:
#
#   "wcd9378_dlkm",
#   "wcd_usbss_i2c",
#   "fsa4480-i2c",
#   "redriver",
#   "repeater",
#   "repeater-qti-pmic-eusb2",
load = [
    "oplus_bsp_synaptics_tcm2",
    "qcom-hv-haptics",
    "nxp-nci",
]

# No [[owners]] at all. This phone's NFC is driven by TMS, so its kernel makes
# /dev/tms_nfc and never /dev/nq-nci: checked here, /dev/tms_nfc is there and
# /dev/nq-nci is not. An owner entry whose file never appears stops the whole
# bring-up after five seconds, and every key program after it is never started.
# Nothing here needs one: the keys are opened through the TEE alone.

# The WLAN firmware and the apps the secure world loads live on the modem
# partition, which the phone mounts at /vendor/firmware_mnt.
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# The phone's own post-boot script, as kernel-post-boot in
# /vendor/etc/init/hw/init.qti.kernel.rc: the performance governor, the handover
# to WALT, and how the memory bus scales.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# No key programs listed here. The recovery reads the phone's own init scripts
# out of its partitions and starts what they name for the keys — qseecomd, the
# QSEECom service, the key service, the credential service and the boot
# service — in the order and with the accounts and library paths the phone
# gives them, /odm/lib64 included. Listing the same programs here starts each
# of them twice, and two key services and two credential services on one
# phone take the secure world's answers away from each other: the decrypt
# page waits for an answer that never comes and the phone hangs. This is what
# the Ace 6 port found, and what it removed them for.

# The modems the bootloader leaves offline in a recovery. On this phone the
# remote processors are numbered adsp 0, cdsp 1, mss 2 and wpss 3, where the
# Ace 6's are named in another order, so the modem is remoteproc2 here. The
# audio DSP, remoteproc0, comes up with it.
[[service]]
path = "/system/bin/sh"
args = [
    "-c",
    "echo start > /sys/class/remoteproc/remoteproc2/state; echo start > /sys/class/remoteproc/remoteproc0/state; sleep 6",
]
oneshot = true
user = "root"
groups = ["root"]

# WLAN on this phone is Qualcomm's WCN7750 on the wpss remote processor, driven
# by qca_cld3_wcn7750 through icnss2, where the Ace 6 port loads kiwi_v2 through
# cnss2. rfkill is one of the kernel's own modules, on system_dlkm, and is
# missing from the vendor's modules.dep although cfg80211 needs its symbols, so
# it is asked for first. Checked on this phone:
# /system_dlkm/lib/modules/rfkill.ko,
# /vendor_dlkm/lib/modules/cfg80211.ko,
# /vendor_dlkm/lib/modules/qca_cld3_wcn7750.ko and
# /vendor/etc/wifi/wcn7750/WCNSS_qcom_cfg.ini.
#
# icnss2 has no /sys/kernel/cnss/fs_ready: on this platform the chip is brought
# up by booting wpss, which the phone's own init.vendor.wlan.rc does in its
# early-boot action:
#
#   write /sys/kernel/icnss/wlan_en_delay 1000
#   write /sys/kernel/icnss/wpss_boot 1
#
# Without that write, icnss2 loads no firmware and wlan0 never appears.
[wlan]
modules = ["rfkill", "cfg80211", "qca_cld3_wcn7750"]
writes = [
    { path = "/sys/kernel/icnss/wlan_en_delay", value = "1000" },
    { path = "/sys/kernel/icnss/wpss_boot", value = "1" },
]
firmware = [
    { name = "wlan/qca_cld/wcn7750/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/wcn7750/WCNSS_qcom_cfg.ini" },
    { name = "wlan/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/wcn7750/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# Haptics: qcom-hv-haptics is in vendor_dlkm and loads, but this phone exposes
# no /sys/class/qcom-haptics node to read the motor's period from; its only
# haptic class is haptic_fb_class, from oplus_haptic. The port's default period
# is used until that is worked out.

# Partitions a baseband and EFS backup takes. All of them exist here;
# oplusstanvbk is kept per slot and is left out.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist", "oplusdycnvbk"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/fingerprint",
    "vendor/fingerprint_ori",
    "vendor/secure_element",
    "vendor/tui",
]

[wipe]
logs = [
    "/data/vendor/oplus/log",
    "/data/vendor/olog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/imslogs",
    "/data/vendor/qms_logs",
    "/data/vendor/tz_log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/camera/coredump",
    "/data/vendor/camera_remote_dump",
    "/data/tombstones",
    "/data/ramdump",
]

# No [stock] table: the factory recovery this image is made on is not served at
# a URL that carries its version, so it is not fetched from OnePlus's server.
# It is kept as an asset of the release tagged stock-plu110 instead, and the
# build takes it from there:
#
#   image    recovery_PLU110_Android16.img, 100 MiB, taken from recovery_a
#            of a phone running PLU110_16.0.9.405(CN01) / ColorOS 16.1.0
#   sha256   cb93d62024f7b26cccf31232fdf8c26c546f566f8556ed9e14c48f8b337d377b
