name: Build

# The recovery is built here on Ubuntu with the NDK, for the one device this
# fork carries: the OnePlus Turbo 6 (PLU110 / OP60F0L1). The factory recovery
# the image is made on is not fetched from OnePlus's server -- the stock command
# wants a full update package at a URL that carries its version -- but taken
# from the release tagged stock-plu110 in this repository, whose asset is the
# genuine recovery partition of that phone, checked against STOCK_SHA256 below.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEVICE: op60f0l1
  STOCK_URL: https://github.com/MingZhi-awa/skyward-for-oneplusturbo6/releases/download/stock-plu110/recovery_PLU110_Android16.img
  STOCK_SHA256: cb93d62024f7b26cccf31232fdf8c26c546f566f8556ed9e14c48f8b337d377b
  STOCK_VERSION: PLU110_16.0.9.405

jobs:
  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is there
      # to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  recovery:
    name: Recovery for ${{ github.event.inputs.device || 'op60f0l1' }}
    needs: [tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Take the stock recovery from the release
        run: |
          mkdir -p stock
          curl -L --fail --retry 3 -o stock/recovery.img "$STOCK_URL"
          echo "$STOCK_SHA256  stock/recovery.img" | sha256sum --check
      - name: Read the device configuration
        id: cfg
        run: |
          model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' devices/$DEVICE.toml)
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - name: Pack the recovery
        id: pack
        env:
          STOCK: ${{ env.STOCK_VERSION }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir -p out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "out/$name.img"
      # The image is the whole partition, flashed as it is, and most of it is the
      # room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: |
          zip -9 "$NAME.zip" "$NAME.img"
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
      # An artifact that is not zipped holds one file, so the image and its sum
      # go up as two; the release job takes them by their names.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}.sha256
          path: out/${{ steps.pack.outputs.name }}.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL: OnePlus Turbo 6
        run: |
          cd images
          sha256sum -- *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Skyward for the $MODEL ($DEVICE), built on $STOCK_VERSION." \
            *.zip SHA256SUMS
